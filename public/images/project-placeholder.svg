<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
  <title id="title">Project preview placeholder</title>
  <desc id="description">Abstract blue and indigo background with a code symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#background)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <g fill="none" stroke="#a5f3fc" stroke-linecap="round" stroke-linejoin="round" stroke-width="24" opacity=".85">
    <path d="m520 300-95 75 95 75"/>
    <path d="m680 300 95 75-95 75"/>
    <path d="m630 270-60 210"/>
  </g>
  <text x="600" y="565" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" opacity=".8">PROJECT PREVIEW</text>
</svg>
